<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 448" role="img" aria-label="Only boot loads with the shell; the rest waits to be called" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5b2a6"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">Only boot loads with the shell; the rest waits to be called</text><text x="24" y="54" fill="#5f5e5a">Solid arrows carry control. Dashed arrows carry information.</text><g fill="none" stroke="#b5b2a6" stroke-width="1.25"><path d="M232 144V176" marker-end="url(#layers-arrow)"></path><path d="M124 264V296" marker-end="url(#layers-arrow)"></path><path d="M340 264V296" marker-end="url(#layers-arrow)"></path><path d="M612 160V296" stroke-dasharray="5 4" marker-end="url(#layers-arrow)"></path><path d="M124 384V408H612V384" stroke-dasharray="5 4" marker-end="url(#layers-arrow)"></path><path d="M488 312H464V220H440" stroke-dasharray="5 4" marker-end="url(#layers-arrow)"></path></g><g><rect x="24" y="72" width="416" height="72" rx="8" fill="#2d72d9" fill-opacity="0.12" stroke="#2d72d9" stroke-width="2"></rect><text x="36" y="96" font-size="13" font-weight="600" fill="#1f1e1d">1 · Boot</text><text x="36" y="112" fill="#1f1e1d">Loads with every interactive shell: constants, PATH, aliases</text><text x="36" y="128" fill="#1f1e1d">Registers names and executes nothing</text></g><g><rect x="488" y="72" width="248" height="88" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="500" y="96" font-size="13" font-weight="600" fill="#1f1e1d">2 · Living tissue</text><text x="500" y="112" fill="#1f1e1d">Always on, outside the shell</text><text x="500" y="128" fill="#1f1e1d">tmux hooks, CLI hooks, watcher</text><text x="500" y="144" fill="#1f1e1d">Notices and writes events only</text></g><g><rect x="24" y="176" width="416" height="88" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="200" font-size="13" font-weight="600" fill="#1f1e1d">3 · Gates</text><text x="36" y="216" fill="#1f1e1d">Executables in bin/, read when called</text><text x="36" y="232" fill="#1f1e1d">Called by an alias, key, popup or hook</text><text x="36" y="248" fill="#1f1e1d">Check input, resolve the target, dispatch</text></g><g><rect x="24" y="296" width="200" height="88" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="320" font-size="13" font-weight="600" fill="#1f1e1d">4 · Bricks</text><text x="36" y="336" fill="#1f1e1d">Autoload functions</text><text x="36" y="352" fill="#1f1e1d">Read on first call</text><text x="36" y="368" fill="#1f1e1d">One side effect each</text></g><g><rect x="240" y="296" width="200" height="88" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="252" y="320" font-size="13" font-weight="600" fill="#1f1e1d">5 · Services</text><text x="252" y="336" fill="#1f1e1d">Python, called by gates</text><text x="252" y="352" fill="#1f1e1d">Data in, JSON out</text><text x="252" y="368" fill="#1f1e1d">Never touch tmux</text></g><g><rect x="488" y="296" width="248" height="88" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="500" y="320" font-size="13" font-weight="600" fill="#1f1e1d">6 · Substrate</text><text x="500" y="336" fill="#1f1e1d">Files: bus, events, state, status</text><text x="500" y="352" fill="#1f1e1d">The only sideways channel</text><text x="500" y="368" fill="#1f1e1d">Outlives every process</text></g><text x="240" y="164" fill="#5f5e5a">you call a name</text><text x="132" y="284" fill="#5f5e5a">dispatch</text><text x="348" y="284" fill="#5f5e5a">ask, get JSON</text><text x="620" y="232" fill="#5f5e5a">write events</text><text x="472" y="268" fill="#5f5e5a">read</text><text x="368" y="426" text-anchor="middle" fill="#5f5e5a">write state and events</text></svg>
