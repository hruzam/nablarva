<svg xmlns="http://www.w3.org/2000/svg" width="760" height="488" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 488" role="img" aria-label="Every message is a file; tmux only rings the doorbell" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="msg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5b2a6"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">Every message is a file; tmux only rings the doorbell</text><text x="24" y="54" fill="#5f5e5a">Agent output and your prompts take the same path through the bus.</text><g fill="none" stroke="#b5b2a6" stroke-width="1.25"><path d="M134 152V184" marker-end="url(#msg-arrow)"></path><path d="M626 152V184" marker-end="url(#msg-arrow)"></path><path d="M380 240V280" marker-end="url(#msg-arrow)"></path><path d="M270 316H134V408" marker-end="url(#msg-arrow)"></path><path d="M490 316H626V408" marker-end="url(#msg-arrow)"></path></g><g><rect x="24" y="80" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="104" font-size="13" font-weight="600" fill="#1f1e1d">Agent A pane</text><text x="36" y="120" fill="#1f1e1d">its Stop hook writes the turn’s</text><text x="36" y="136" fill="#1f1e1d">final text into the bus</text></g><g><rect x="516" y="80" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="528" y="104" font-size="13" font-weight="600" fill="#1f1e1d">You, in a popup</text><text x="528" y="120" fill="#1f1e1d">compose a prompt for an agent</text><text x="528" y="136" fill="#1f1e1d">and pick who receives it</text></g><g><rect x="24" y="184" width="712" height="56" rx="8" fill="#2d72d9" fill-opacity="0.12" stroke="#2d72d9" stroke-width="2"></rect><text x="36" y="208" font-size="13" font-weight="600" fill="#1f1e1d">Bus: one file per message</text><text x="36" y="224" fill="#1f1e1d">content stays in files; a pane only ever receives the doorbell</text></g><g><rect x="270" y="280" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="282" y="304" font-size="13" font-weight="600" fill="#1f1e1d">Classifier</text><text x="282" y="320" fill="#1f1e1d">addressed: passes through</text><text x="282" y="336" fill="#1f1e1d">the rest: rules, model optional</text></g><g><rect x="24" y="408" width="220" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="432" font-size="13" font-weight="600" fill="#1f1e1d">Agent B pane</text><text x="36" y="448" fill="#1f1e1d">doorbell: read this file</text></g><g><rect x="516" y="408" width="220" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="528" y="432" font-size="13" font-weight="600" fill="#1f1e1d">You</text><text x="528" y="448" fill="#1f1e1d">shown in status or a popup</text></g><text x="142" y="172" fill="#5f5e5a">writes output</text><text x="618" y="172" text-anchor="end" fill="#5f5e5a">writes the prompt</text><text x="388" y="264" fill="#5f5e5a">new message</text><text x="202" y="308" text-anchor="middle" fill="#5f5e5a">for an agent</text><text x="558" y="308" text-anchor="middle" fill="#5f5e5a">for you, or unsure</text></svg>
