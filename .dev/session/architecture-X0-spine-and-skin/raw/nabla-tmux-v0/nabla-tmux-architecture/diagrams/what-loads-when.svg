<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 368" role="img" aria-label="A new shell reads three small files; a call reads only its own path" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="load-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5b2a6"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">A new shell reads three small files; a call reads only its own path</text><text x="24" y="80" font-size="13" font-weight="600" fill="#5f5e5a">New interactive shell</text><text x="396" y="80" font-size="13" font-weight="600" fill="#5f5e5a">A call from an alias, key, popup or hook</text><g fill="none" stroke="#b5b2a6" stroke-width="1.25"><path d="M194 152V184" marker-end="url(#load-arrow)"></path><path d="M194 256V288" marker-end="url(#load-arrow)"></path><path d="M566 152V184" marker-end="url(#load-arrow)"></path><path d="M566 256V288" marker-end="url(#load-arrow)"></path></g><g><rect x="24" y="96" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="120" font-size="13" font-weight="600" fill="#1f1e1d">.zshrc</text><text x="36" y="136" fill="#1f1e1d">one Nabla line: source shell/init.zsh</text></g><g><rect x="24" y="184" width="340" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="208" font-size="13" font-weight="600" fill="#1f1e1d">shell/init.zsh</text><text x="36" y="224" fill="#1f1e1d">adds bin/ to PATH, sources boot/env.zsh</text><text x="36" y="240" fill="#1f1e1d">and shell/aliases.zsh</text></g><g><rect x="24" y="288" width="340" height="56" rx="8" fill="#2d72d9" fill-opacity="0.12" stroke="#2d72d9" stroke-width="2"></rect><text x="36" y="312" font-size="13" font-weight="600" fill="#1f1e1d">Ready</text><text x="36" y="328" fill="#1f1e1d">no gate, brick or service has been read</text></g><g><rect x="396" y="96" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="408" y="120" font-size="13" font-weight="600" fill="#1f1e1d">bin/nabla</text><text x="408" y="136" fill="#1f1e1d">router: finds bin/nabla-pane and execs it</text></g><g><rect x="396" y="184" width="340" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="408" y="208" font-size="13" font-weight="600" fill="#1f1e1d">bin/nabla-pane</text><text x="408" y="224" fill="#1f1e1d">gate: sources env.zsh, marks brick names</text><text x="408" y="240" fill="#1f1e1d">checks input and picks the verb</text></g><g><rect x="396" y="288" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="408" y="312" font-size="13" font-weight="600" fill="#1f1e1d">pipes/pane/pane-spawn</text><text x="408" y="328" fill="#1f1e1d">read now, on its first call; siblings stay unread</text></g></svg>
