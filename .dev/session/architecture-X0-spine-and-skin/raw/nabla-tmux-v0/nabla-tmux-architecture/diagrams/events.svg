<svg xmlns="http://www.w3.org/2000/svg" width="760" height="504" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 504" role="img" aria-label="Every source writes the same record; readers can change later" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="events-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5b2a6"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">Every source writes the same record; readers can change later</text><text x="24" y="54" fill="#5f5e5a">Dashed parts come later. Nothing above them has to change.</text><g fill="none" stroke="#b5b2a6" stroke-width="1.25"><path d="M107 144V184" marker-end="url(#events-arrow)"></path><path d="M289 144V184" marker-end="url(#events-arrow)"></path><path d="M471 144V184" marker-end="url(#events-arrow)"></path><path d="M653 144V184" marker-end="url(#events-arrow)"></path><path d="M194 256V296" marker-end="url(#events-arrow)"></path><path d="M194 368V408" marker-end="url(#events-arrow)"></path><path d="M566 256V296" stroke-dasharray="5 4" marker-end="url(#events-arrow)"></path><path d="M566 368V408" stroke-dasharray="5 4" marker-end="url(#events-arrow)"></path></g><g><rect x="24" y="72" width="166" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="96" font-size="13" font-weight="600" fill="#1f1e1d">tmux hooks</text><text x="36" y="112" fill="#1f1e1d">pane exited or died,</text><text x="36" y="128" fill="#1f1e1d">bell, silence</text></g><g><rect x="206" y="72" width="166" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="218" y="96" font-size="13" font-weight="600" fill="#1f1e1d">CLI hooks</text><text x="218" y="112" fill="#1f1e1d">session start, end,</text><text x="218" y="128" fill="#1f1e1d">turn done, attention</text></g><g><rect x="388" y="72" width="166" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="400" y="96" font-size="13" font-weight="600" fill="#1f1e1d">Runbook runner</text><text x="400" y="112" fill="#1f1e1d">step done or failed,</text><text x="400" y="128" fill="#1f1e1d">run finished</text></g><g><rect x="570" y="72" width="166" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="582" y="96" font-size="13" font-weight="600" fill="#1f1e1d">Bus and popups</text><text x="582" y="112" fill="#1f1e1d">message written,</text><text x="582" y="128" fill="#1f1e1d">prompt composed</text></g><g><rect x="24" y="184" width="712" height="72" rx="8" fill="#2d72d9" fill-opacity="0.12" stroke="#2d72d9" stroke-width="2"></rect><text x="36" y="208" font-size="13" font-weight="600" fill="#1f1e1d">Event log: events/*.jsonl</text><text x="36" y="224" fill="#1f1e1d">one JSON line per event, the same fields from every source</text><text x="36" y="240" fill="#1f1e1d">append-only, so any view can be rebuilt by replaying it</text></g><g><rect x="24" y="296" width="340" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="320" font-size="13" font-weight="600" fill="#1f1e1d">Today: a small watcher</text><text x="36" y="336" fill="#1f1e1d">tail -F on the log, or inotifywait</text><text x="36" y="352" fill="#1f1e1d">runs the few reactions you have</text></g><g><rect x="396" y="296" width="340" height="72" rx="8" fill="none" stroke="#b5b2a6" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="408" y="320" font-size="13" font-weight="600" fill="#1f1e1d">Later: a broker</text><text x="408" y="336" fill="#1f1e1d">one Go or Rust binary on the same records</text><text x="408" y="352" fill="#1f1e1d">adds ordering, retries, subscriptions</text></g><g><rect x="24" y="408" width="712" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b5b2a6" stroke-width="1.25"></rect><text x="36" y="432" font-size="13" font-weight="600" fill="#1f1e1d">Reactions</text><text x="36" y="448" fill="#1f1e1d">update status.md, which the control pane shows</text><text x="36" y="464" fill="#1f1e1d">ring the doorbell: tell a pane which file to read</text></g></svg>
